    <title>
      TaifaDevs — Your Trusted Partner for Modern IT Solutions in Kenya
    </title>

    <meta
      name="description"
      content="TaifaDevs helps Kenyan businesses build simple, reliable websites and business systems. Clear pricing, local support, and technology made easy."
    />

    <style>
      .page {
        min-height: 100vh;
        position: relative;
        overflow: hidden;
      }

      .bg-texture {
        display: none;
      }

      .topbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 6vw;
        z-index: 10;
        gap: 12px;
        background: linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.9),
          rgba(0, 0, 0, 0.75)
        );
      }

      .topbar .nav a {
        color: var(--nav-text);
      }

      .topbar .nav a:hover {
        color: var(--nav-text-hover);
      }

      .topbar .nav-ico {
        fill: var(--nav-text);
      }

      .topbar .icon-btn {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid var(--nav-border);
      }

      .topbar .icon-btn:hover {
        border-color: var(--nav-text-hover);
      }

      section[id] {
        scroll-margin-top: var(--topbar-h);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
      }

      .brand img {
        height: 35px;
        width: auto;
        display: block;
        transition:
          opacity 0.2s ease,
          transform 0.2s ease;
      }
      .brand:hover img {
        opacity: 0.85;
        transform: translateY(-0.5px);
      }

      .brand-mark {
        width: 12px;
        height: 12px;
        border-radius: 999px;
        background: var(--cyan);
        box-shadow: 0 0 0 6px rgb(0 247 255 / 10%);
      }

      .badge {
        display: inline-block;
        font-size: 0.75rem;
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(0, 247, 255, 0.12);
        color: var(--text);
        margin-bottom: 10px;
        font-weight: 700;
      }
      .nav {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-left: auto;
      }

      .nav a {
        color: var(--muted);
        font-weight: 600;
      }

      .nav a:hover {
        color: var(--text);
        text-decoration: underline;
        text-underline-offset: 6px;
      }

      .nav .nav-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        line-height: 1;
      }

      .nav .nav-ico {
        width: 16px;
        height: 16px;
        flex: 0 0 16px;
        display: block;
        fill: currentColor;
      }

      .icon-btn {
        width: 35px;
        height: 35px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--subtle);
        cursor: pointer;
        display: grid;
        place-items: center;
        margin-left: 6px;
      }

      .icon-btn:hover {
        border-color: rgb(0 247 255 / 35%);
      }

      .icon-btn .dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--cyan), var(--pink));
      }

      /* main layout */
      .main {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 9vh 6vw;
        position: relative;
        z-index: 2;
      }

      .container {
        width: min(560px, calc(100% - 44px));
        margin: 0 auto;
        text-align: center;
      }

      .faq {
        margin-top: 30px;
        text-align: left;
      }

      .faq h3 {
        margin-bottom: 10px;
      }

      .faq details {
        margin-bottom: 10px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--subtle);
      }

      .faq summary {
        cursor: pointer;
        font-weight: 700;
      }
      /* copy */
      .hero-copy {
        margin-bottom: 26px;
      }

      .eyebrow {
        margin: 0 0 12px;
        font-size: 0.88rem;
        color: var(--muted);
        letter-spacing: 0.02em;
      }

      h1 {
        font-weight: 800;
        font-size: clamp(35px, 4.5vw, 48px);
        line-height: 1.15;
        letter-spacing: -1.8px;
        margin: 0 0 14px;
      }

      .lead {
        margin: 0 0 18px;
        color: var(--muted);
        line-height: 1.75;
        font-size: 1.08rem;
        font-weight: 500;
      }

      .cta-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        margin-top: 14px;
        margin-bottom: 18px;
      }

      .secondary-cta {
        color: var(--muted);
        font-weight: 700;
      }
      .secondary-cta:hover {
        color: var(--text);
        text-decoration: underline;
        text-underline-offset: 6px;
      }

      /* form */
      .form {
        margin-top: 10px;
      }

      .form label {
        display: block;
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--muted);
        margin-bottom: 8px;
        text-align: left;
      }

      .input-row {
        display: flex;
        gap: 10px;
        justify-content: center;
        align-items: stretch;
      }

      .form input {
        flex: 1;
        padding: 12px 14px;
        border-radius: var(--radius-lg);
        border: 1px solid var(--border);
        background: var(--input);
        color: var(--text);
        outline: none;
        font-size: 1rem;
      }

      .form input:focus {
        border-color: rgb(0 247 255 / 55%);
        box-shadow: var(--ring);
      }

      .submit {
        border: none;
        border-radius: var(--radius-lg);
        font-weight: 800;
        cursor: pointer;
        padding: 12px 16px;
        white-space: nowrap;
        color: #071014;
        background: linear-gradient(
          135deg,
          rgb(0 247 255 / 95%),
          rgb(255 0 135 / 80%)
        );
        box-shadow: 0 4px 10px rgb(0 0 0 / 10%);
      }

      .submit:hover {
        transform: translateY(-1px);
      }

      .submit--soft {
        background: var(--subtle);
        color: var(--text);
        border: 1px solid var(--border);
        box-shadow: none;
      }

      .submit--soft:hover {
        border-color: rgb(0 247 255 / 35%);
      }

      /* contact textarea matches inputs */
      .form textarea {
        width: 100%;
        padding: 12px 14px;
        border-radius: var(--radius-lg);
        border: 1px solid var(--border);
        background: var(--input);
        color: var(--text);
        outline: none;
        font-size: 1rem;
        line-height: 1.5;
        min-height: 110px;
        resize: vertical;
        margin-top: 6px;
      }

      .form textarea:focus {
        border-color: rgb(0 247 255 / 55%);
        box-shadow: var(--ring);
      }

      .contact-actions {
        display: flex;
        gap: 10px;
        margin-top: 12px;
        align-items: center;
      }

      .wa-btn {
        width: 50px;
        height: 50px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        background: rgba(37, 211, 102, 0.12);
        border: 1px solid rgba(37, 211, 102, 0.35);
        cursor: pointer;
        position: relative;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }
      .wa-btn::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background: rgba(37, 211, 102, 0.35);
        opacity: 0.6;
        z-index: -1;
        animation: waPulse 2.2s infinite;
      }
      .wa-btn:hover {
        transform: translateY(-2px);
      }

      .wa-btn:hover::before {
        opacity: 1;
      }

      .wa-icon {
        width: 22px;
        height: 22px;
        fill: #25d366;
      }
      /* key pulse animation */
      @keyframes waPulse {
        0% {
          transform: scale(1);
          opacity: 0.5;
        }
        70% {
          transform: scale(1.6);
          opacity: 0;
        }
        100% {
          transform: scale(1.6);
          opacity: 0;
        }
      }

      .form-status {
        margin-top: 12px;
        font-size: 0.9rem;
        color: var(--muted);
      }

      .form-status.success {
        color: rgb(0 247 255 / 85%);
      }

      .form-status.error {
        color: rgb(255 0 135 / 85%);
      }

      /* footer */
      .footer {
        margin-top: 18px;
        font-size: 0.92rem;
        color: var(--muted);
      }
      .footer a {
        text-decoration: underline;
        text-underline-offset: 4px;
      }
      .footer a:hover {
        color: rgb(0 247 255 / 85%);
      }

      /* projects */
      .projects {
        margin-top: 44px;
        text-align: left;
        border-top: 1px solid var(--border);
        padding-top: 22px;
      }

      .projects h2 {
        margin: 0 0 14px;
        font-size: 1rem;
        letter-spacing: -0.2px;
      }
      .projects-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
      }
      .projects-header h2 {
        margin: 0;
      }

      .project-list {
        display: grid;
        gap: 10px;
      }

      .project {
        display: block;
        padding: 14px;
        border-radius: var(--radius-lg);
        border: 1px solid var(--border);
        background: var(--subtle);
      }

      .project.highlight {
        border: 1px solid rgba(0, 247, 255, 0.35);
        transform: translateY(-2px);
      }

      .tabs {
        display: flex;
        gap: 14px;
      }

      .tabs button {
        background: none;
        border: none;
        padding: 0;
        font-family: inherit;
        font-size: 0.92rem;
        font-weight: 700;
        color: var(--muted);
        cursor: pointer;
        position: relative;
      }
      .tabs button:hover {
        color: var(--text);
      }
      .tabs button.active::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: -6px;
        width: 100%;
        height: 2px;
        background: rgb(0 247 255 / 70%);
        border-radius: 2px;
      }
      .case-study {
        margin-top: 18px;
        padding: 16px;
        border-radius: var(--radius-lg);
        border: 1px solid rgba(0, 247, 255, 0.25);
        background: var(--subtle);
      }

      .case-study h3 {
        margin: 0 0 8px;
        font-size: 0.95rem;
      }

      .case-study p {
        margin: 0 0 10px;
        color: var(--muted);
        line-height: 1.6;
      }

      .case-study a {
        font-weight: 800;
        color: var(--text);
      }

      .case-study a:hover {
        color: rgb(0 247 255 / 85%);
      }

      .project:hover {
        border-color: rgb(0 247 255 / 35%);
      }

      .project-title {
        font-weight: 800;
        letter-spacing: -0.2px;
      }

      .project-meta {
        margin-top: 4px;
        font-size: 0.92rem;
        color: var(--muted);
      }

      .tiny-note {
        margin-top: 18px;
        font-size: 0.85rem;
        color: var(--muted);
      }

      /* mobile */
      @media (max-width: 520px) {
        .contact-actions {
          flex-direction: row-reverse;
          align-items: stretch;
        }
        .wa-btn {
          width: 50px;
          flex-shrink: 0;
        }
        .submit {
          font-weight: 800;
        }
        .wa-btn {
          opacity: 0.9;
        }
        .nav {
          position: fixed;
          right: 14px;
          bottom: 14px;
          flex-direction: column;
          align-items: flex-end;
          gap: 10px;
          z-index: 50;
        }

        .nav .nav-link {
          display: flex;
          align-items: center;
          gap: 10px;
          padding: 10px 12px;
          border: 1px solid var(--border);
          background: rgb(0 0 0 / 22%);
          border-radius: 999px;
          box-shadow: 0 4px 10px rgb(0 0 0 / 10%);
          backdrop-filter: blur(8px);
        }

        .nav .nav-ico {
          width: 18px;
          height: 18px;
          fill: currentColor;
          opacity: 0.9;
        }

        .nav .nav-link span {
          font-size: 0.9rem;
        }

        .brand img {
          height: 30px;
        }
        .input-row {
          flex-direction: column;
        }
        .submit {
          width: 100%;
        }
      }
    </style>
    <script>
      const savedTheme = localStorage.getItem("taifa-theme") || "dark";
      document.documentElement.setAttribute("data-theme", savedTheme);
    </script>
